name: One-truth release gate

# Decision Integrity release control: standing-gate is a public claim-bearing
# surface of Wheeler Hubbell Publishing and the published entry point
# (wheelerhubbell/standing-gate@v0) through which outside CI consults the
# Standing service. No change to main is released unless the single
# authoritative conformance examination (scripts/check_conformance.py, whose
# only home is the standing-mark repo, itself release-gated) authorizes
# passage in gate mode. The same examination governs every WHP release
# channel; this repo adds no parallel check. See docs/conformance.md in
# standing-mark.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    if: github.repository == 'wheelerhubbell/standing-gate'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the examination (standing-mark)
        uses: actions/checkout@v5
        with:
          repository: wheelerhubbell/standing-mark
          path: examination

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Live conformance examination (release gate)
        env:
          WHP_CONFORMANCE_REPO_REF: main
        run: python3 examination/scripts/check_conformance.py --gate
