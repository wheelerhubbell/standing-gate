name: 'Standing Gate'
description: 'Autonomous Decision Integrity circuit breaker: evaluates claims, authority, and provenance against WHP epistemic reasoning.'
author: 'wheelerhubbell'
branding:
  icon: 'shield'
  color: 'blue'
inputs:
  mode:
    description: 'Execution mode: "evaluate" (default, submit examination to service) or "verify" (receiving boundary fail-closed verification of presented Mark)'
    required: false
    default: 'evaluate'
  request:
    description: 'Action request payload (JSON string or file path) for mode: verify'
    required: false
    default: ''
  mark:
    description: 'Presented WHP-STANDING-MARK-v1 (JSON string or file path) for mode: verify'
    required: false
    default: ''
  consumed_records_file:
    description: 'Optional path to a JSON file tracking consumed Mark IDs for single-use replay prevention'
    required: false
    default: ''
  api_key:
    description: 'WHP Subscription API Key (Developer, Team, or Institutional tier). Bypasses per-call x402 challenge.'
    required: false
    default: ''
  service_url:
    description: 'Standing Witness service base URL'
    required: false
    default: 'https://decisionintegrity.wheelerhubbellpublishing.com'
  door:
    description: 'Door endpoint to evaluate against (/v1/evaluate, /v1/audit, /v1/ping)'
    required: false
    default: '/v1/evaluate'
  subject:
    description: 'Subject identifier or repository claim'
    required: false
    default: '${{ github.repository }}@${{ github.sha }}'
  claim:
    description: 'Claim to verify or audit'
    required: false
    default: 'CI/CD pipeline release integrity verification'
  provenance:
    description: 'Provenance URI or structured evidence payload (string or JSON)'
    required: false
    default: ''
  structured_input:
    description: 'Complete JSON request body for /v1/evaluate; use the production route contract and optional evaluator fields as supported.'
    required: false
    default: ''
  prior_record_hash:
    description: 'SHA-256 hash of a prior examination record for successive continuity'
    required: false
    default: ''
  prior_record_json:
    description: 'Complete JSON representation of a prior examination record'
    required: false
    default: ''
  mock:
    description: 'Set to "true" for free dry-run structural verification'
    required: false
    default: 'false'
  payment_signature:
    description: 'x402 PAYMENT-SIGNATURE or authorization token for paid doors'
    required: false
    default: ''
  buyer_key:
    description: 'Private key for dynamic EIP-3009 signing on HTTP 402 challenge'
    required: false
    default: ''
outputs:
  allow:
    description: 'Receiving boundary determination: "true" if allowed, "false" if denied'
    value: ${{ steps.gate.outputs.allow }}
  reason_code:
    description: 'Receiving boundary outcome reason code (e.g. ALLOW, INVALID_SIGNATURE, OBJECT_MISMATCH, REPLAY_DETECTED)'
    value: ${{ steps.gate.outputs.reason_code }}
  mark_id:
    description: 'Unique identifier or record hash of the verified Mark'
    value: ${{ steps.gate.outputs.mark_id }}
  consumed:
    description: 'True if single-use Mark was verified and recorded as consumed'
    value: ${{ steps.gate.outputs.consumed }}
  determination:
    description: 'Evaluation determination outcome'
    value: ${{ steps.gate.outputs.outcome }}
  record_hash:
    description: 'SHA-256 hash of the canonical signed evaluation record'
    value: ${{ steps.gate.outputs.hash }}
  record_json:
    description: 'Complete signed evaluation response envelope returned by the service'
    value: ${{ steps.gate.outputs.record_json }}
  signature_status:
    description: 'Signature verification result against the key from live evaluation discovery'
    value: ${{ steps.gate.outputs.signature_status }}
  reception_event_json:
    description: 'Separate client reception event; does not mutate the evaluation record'
    value: ${{ steps.gate.outputs.reception_event_json }}
  prior_record_hash:
    description: 'The prior examination record hash carried forward, if any'
    value: ${{ steps.gate.outputs.prior_record_hash }}
  continuity_status:
    description: 'Successive examination continuity status (e.g. SUCCESSIVE_LINEAGE_ESTABLISHED)'
    value: ${{ steps.gate.outputs.continuity_status }}

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22'
    - id: gate
      shell: bash
      env:
        WHP_MODE: ${{ inputs.mode }}
        WHP_REQUEST: ${{ inputs.request }}
        WHP_MARK: ${{ inputs.mark }}
        WHP_CONSUMED_RECORDS_FILE: ${{ inputs.consumed_records_file }}
        WHP_URL: ${{ inputs.service_url }}
        WHP_DOOR: ${{ inputs.door }}
        WHP_SUBJECT: ${{ inputs.subject }}
        WHP_CLAIM: ${{ inputs.claim }}
        WHP_PROVENANCE: ${{ inputs.provenance || env.WHP_PROVENANCE }}
        WHP_INPUT_JSON: ${{ inputs.structured_input }}
        WHP_PRIOR_RECORD_HASH: ${{ inputs.prior_record_hash }}
        WHP_PRIOR_RECORD_JSON: ${{ inputs.prior_record_json }}
        WHP_MOCK: ${{ inputs.mock }}
        WHP_API_KEY: ${{ inputs.api_key || env.WHP_API_KEY }}
        WHP_PAYMENT: ${{ inputs.payment_signature }}
        WHP_PAYMENT_KEY: ${{ env.WHP_PAYMENT_KEY }}
        WHP_BUYER_KEY: ${{ inputs.buyer_key || env.WHP_BUYER_KEY }}
        WHP_REPOSITORY: ${{ github.repository }}
        WHP_SHA: ${{ github.sha }}
        WHP_REF: ${{ github.ref }}
        WHP_ACTOR: ${{ github.actor }}
      run: |
        if [ "$WHP_MODE" != "verify" ] && ([ -n "$WHP_BUYER_KEY" ] || [ -n "$WHP_PAYMENT_KEY" ]); then
          node -e "import('viem/accounts').catch(() => process.exit(1))" 2>/dev/null || npm i --no-save viem@^2.21.0
        fi
        node "${{ github.action_path }}/gate-check.cjs"
